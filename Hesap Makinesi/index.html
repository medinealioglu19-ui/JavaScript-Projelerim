<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Makinesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Hesap Makinesi</h1>

    <input type="number" id="sayi1" placeholder="Birinci sayıyı girin">

    <input type="number" id="sayi2" placeholder="İkinci sayıyı girin">

    <br><br>

    <button onclick="hesapla('+')">Toplama</button>
    <button onclick="hesapla('-')">Çıkarma</button>
    <button onclick="hesapla('*')">Çarpma</button>
    <button onclick="hesapla('/')">Bölme</button>

    <h3 id="sonuc">Sonuç:</h3>

    <script src="script.js"></script>

</body>
</html>
